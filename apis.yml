name: Blue Studios
description: Blue Studios Labs is a family-focused technology company operating under the tagline "Where
  Families Flourish." It builds consumer digital products that help couples and families explore, learn,
  and grow together. Its portfolio includes Wallio, a shared financial-management app for couples and
  families; Blue Studios EDU, an entertainment-based educational streaming service; and Blue Studios
  Entertainment, a media-production studio creating family-oriented narratives and content. The company
  reports more than 400 million digital views, 350,000 game plays, and 4,000+ classes delivered. Blue
  Studios is a Techstars portfolio company. As of this profile it publishes no public API, developer
  portal, or SDKs.
